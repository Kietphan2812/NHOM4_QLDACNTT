<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Dữ Liệu SQL Server QLGRAB (11 Bảng) - GrabRide</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .sql-table-tab {
      padding: 0.65rem 1.1rem;
      border-radius: var(--radius-md);
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sql-table-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .sql-table-tab.active {
      background: linear-gradient(135deg, rgba(0, 177, 79, 0.25), rgba(6, 182, 212, 0.15));
      border-color: var(--grab-green);
      color: #fff;
      box-shadow: 0 0 15px var(--grab-green-glow);
    }
  </style>
</head>
<body>
  <!-- Header Navbar -->
  <div id="app-header"></div>

  <main class="container">
    <div class="page-header">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 class="page-title">🗄️ Quản Lý CSDL SQL Server: <span style="color: var(--grab-green);">QLGRAB</span></h1>
          <p class="page-subtitle">Xem, Nhập mới (INSERT), Chỉnh sửa (UPDATE) và Xóa (DELETE) cho 11 Bảng CSDL QLGRAB</p>
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <a href="schema_QLGRAB.sql" download class="btn btn-secondary btn-sm">📥 File Script schema_QLGRAB.sql</a>
          <button class="btn btn-grab" onclick="openAddDataModal()">➕ Thêm Bản Ghi SQL Mới</button>
        </div>
      </div>
    </div>

    <!-- 11 Table Selectors -->
    <div class="card" style="margin-bottom: 1.5rem; padding: 1.25rem;">
      <div style="font-size: 0.85rem; font-weight: 700; color: #94a3b8; margin-bottom: 0.75rem;">
        CHỌN BẢNG DỮ LIỆU CSDL QLGRAB (dbo.[Table]):
      </div>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button class="sql-table-tab active" onclick="switchSqlTable('BangGiaCuoc')">📊 dbo.BangGiaCuoc</button>
        <button class="sql-table-tab" onclick="switchSqlTable('CuocXe')">🚕 dbo.CuocXe</button>
        <button class="sql-table-tab" onclick="switchSqlTable('DanhGia')">⭐ dbo.DanhGia</button>
        <button class="sql-table-tab" onclick="switchSqlTable('HoSoTaiXe')">🛵 dbo.HoSoTaiXe</button>
        <button class="sql-table-tab" onclick="switchSqlTable('LichSuGiaoDichVi')">📜 dbo.LichSuGiaoDichVi</button>
        <button class="sql-table-tab" onclick="switchSqlTable('MaGiamGia')">🎟️ dbo.MaGiamGia</button>
        <button class="sql-table-tab" onclick="switchSqlTable('NguoiDung')">👤 dbo.NguoiDung</button>
        <button class="sql-table-tab" onclick="switchSqlTable('NhatKyDiChuyen')">🗺️ dbo.NhatKyDiChuyen</button>
        <button class="sql-table-tab" onclick="switchSqlTable('ThanhToan')">💳 dbo.ThanhToan</button>
        <button class="sql-table-tab" onclick="switchSqlTable('ThongBao')">🔔 dbo.ThongBao</button>
        <button class="sql-table-tab" onclick="switchSqlTable('ViTaiXe')">👛 dbo.ViTaiXe</button>
      </div>
    </div>

    <!-- Active Table Data Card -->
    <div class="card">
      <div class="card-header">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <div class="card-title" id="active-table-title" style="font-size: 1.2rem; color: #fff;">
            Danh Sách Bản Ghi: dbo.BangGiaCuoc
          </div>
          <span id="active-table-count-badge" class="badge badge-green">3 Bản Ghi</span>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary btn-sm" onclick="exportInsertStatements()">📄 Xuất Script INSERT INTO</button>
          <button class="btn btn-grab btn-sm" onclick="openAddDataModal()">➕ Thêm Bản Ghi Mới</button>
        </div>
      </div>

      <!-- Data Table View -->
      <div id="sql-table-data-wrapper" class="custom-table-wrapper">
        <!-- Rendered dynamically by js/sql_management.js -->
      </div>
    </div>
  </main>

  <!-- Add/Edit Record Modal -->
  <div id="add-record-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
    <div class="card" style="width: 90%; max-width: 600px; padding: 2rem; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
        <h2 id="modal-form-title" style="color: #fff; font-size: 1.2rem;">➕ Nhập Dữ Liệu Mới Vào Bảng SQL</h2>
        <button onclick="closeAddDataModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">✕</button>
      </div>

      <form id="dynamic-sql-form" onsubmit="saveRecordToSql(event)">
        <div id="form-fields-container" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
          <!-- Dynamically generated fields -->
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeAddDataModal()">Hủy</button>
          <button type="submit" class="btn btn-grab">💾 Lưu Vào CSDL QLGRAB</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="js/common.js"></script>
  <script src="js/sql_connector.js"></script>
  <script src="js/sql_management.js"></script>
</body>
</html>
